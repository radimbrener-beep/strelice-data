name: Deploy na Wedos (strelice.jaksemame.cz + rozcestník jaksemame.cz)

# Při každém pushi do main se vezmou statické HTML stránky portálu
# a nahrají přes FTP na Wedos hosting. Spustit lze i ručně (workflow_dispatch).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-wedos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}   # rozesílání upozornění (push/send.php); bez něj se nerozesílají
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sestavit složku k nasazení (portálové HTML)
        run: |
          mkdir -p public
          # všechny portálové stránky v kořeni kromě dočasných "_*.html"
          # (loga apod. jsou vložená přímo v HTML jako data-URI → žádné přílohy)
          find . -maxdepth 1 -name '*.html' ! -name '_*' -exec cp {} public/ \;
          # písma značky (stránky je načítají relativně z fonts/) + favikony a manifest do kořene
          cp -r fonts public/
          cp brand/favicon/* public/
          # sdílecí obrázek pro náhled odkazu (plochý soubor v kořeni, ne podsložka)
          cp og-image.png public/ 2>/dev/null || true
          # .htaccess pro čisté URL bez .html
          cp .htaccess public/ 2>/dev/null || true
          # neveřejný textový soubor s plnými přepisy ZO (jen přes přímý odkaz /prepisy-zo.txt)
          cp prepisy-zo.txt public/ 2>/dev/null || true
          # upozornění (Web Push): seznam položek k oznámení, PHP backend a service worker
          python3 build_push.py
          cp -r push public/push
          cp sw.js public/
          echo "Nasazované soubory:"
          ls -la public/ public/push

      - name: Token pro rozesílání upozornění
        # bez secretu PUSH_TOKEN se upozornění nerozesílají, nasazení ale proběhne
        if: env.PUSH_TOKEN != ''
        run: |
          python3 - <<'PY'
          import os
          t = os.environ["PUSH_TOKEN"]
          assert len(t) >= 20, "PUSH_TOKEN je kratší než 20 znaků"
          php = "<?php" + chr(10) + "return ['token' => %r];" % t + chr(10)
          open("public/push/config.local.php", "w").write(php)
          PY

      - name: Sestavit rozcestník jaksemame.cz
        run: |
          mkdir -p public_hub
          cp jaksemame/index.html public_hub/
          cp -r fonts public_hub/
          cp brand/favicon/* public_hub/
          ls -la public_hub/

      - name: Sestavit starou doménu jakzijistrelice.cz (přesměrování)
        run: |
          # celý web + .htaccess s Redirect 301 → stránky zůstanou na serveru (sync je nesmaže),
          # ale návštěvníky přesměruje na strelice.jaksemame.cz
          cp -r public public_old
          cp redirect/jakzijistrelice/.htaccess public_old/.htaccess
          rm -rf public_old/push public_old/sw.js   # upozornění jen na strelice.jaksemame.cz

      # Web se nasazuje jen do podsložky subdomény strelice.jaksemame.cz.
      # Stará adresa jakzijistrelice.cz se přesměrovává (krok níže); data.strelicnik.cz je zrušená.
      - name: Deploy přes FTP na Wedos (strelice.jaksemame.cz)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /www/subdom/strelice/   # docroot subdomény strelice (Wedos: /www/subdom/<subdoména>/, končí lomítkem)
          local-dir: ./public/
          # pozn.: akce dělá inkrementální sync (stav drží v .ftp-deploy-sync-state.json na serveru);
          # složka musí být vyhrazená jen tomuto webu (sync může mazat cizí soubory).
          # push/data/ (SQLite s odběrateli) vytváří PHP na serveru — sync ho nezná, takže ho nemaže.

      - name: Rozeslání upozornění na nová jednání
        if: env.PUSH_TOKEN != ''
        # web je nasazený i tehdy, když rozeslání selže; chyba je vidět v záznamu
        continue-on-error: true
        run: |
          curl -fsS --max-time 300 -X POST --data "" -H "Authorization: Bearer $PUSH_TOKEN" https://strelice.jaksemame.cz/push/send.php
          echo

      # Rozcestník obcí na hlavní doméně. Doména jaksemame.cz musí mít na Wedosu VLASTNÍ složku
      # (ne alias hlavní domény — ta sdílí kořen s WordPressem strelicnik.cz).
      - name: Deploy přes FTP na Wedos (rozcestník jaksemame.cz)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /www/domains/jaksemame.cz/   # docroot domény (Wedos konvence /www/domains/<doména>/)
          local-dir: ./public_hub/

      # Stará adresa jakzijistrelice.cz → 301 na https://strelice.jaksemame.cz (redirect/jakzijistrelice/.htaccess)
      - name: Deploy přes FTP na Wedos (přesměrování jakzijistrelice.cz)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /www/domains/jakzijistrelice.cz/
          local-dir: ./public_old/
